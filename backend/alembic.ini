[alembic]
script_location = app/db/migrations
prepend_sys_path = .

# Revisions are numbered, not hashed, so `ls versions/` reads in order.
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is deliberately absent. env.py takes the DSN from KINEX_DATABASE_URL
# via app.config, so there is exactly one place a connection string comes from.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
