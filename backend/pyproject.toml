[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinex-backend"
version = "0.1.0"
description = "KineX cloud coaching backend"
requires-python = ">=3.12,<3.13"

# Versions verified against PyPI on 21 Aug 2026, not recalled. Lower bounds are the
# release in use; the upper bounds keep a rebuild from silently taking a major bump.
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]>=0.52.4,<0.53",
    "asyncpg>=0.31.0,<0.32",
    "pydantic-settings>=2.15.0,<3",
    "alembic>=1.19.1,<2",
    # SQLAlchemy is alembic's own dependency and is used only as alembic's engine.
    # The runtime data path is raw asyncpg — see the locked decisions in the root design doc.
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
