# Copy to k3s/03-secret.yaml, fill in, apply. That path is gitignored — the same
# arrangement as backend/.env.example and backend/.env, and for the same reason: one of
# these values is a real credential for a real third-party account.
#
#   cp deploy/secret.example.yaml deploy/k3s/03-secret.yaml
#   $EDITOR deploy/k3s/03-secret.yaml
#   kubectl apply -f deploy/k3s/
#
# **This file lives one directory above the manifests on purpose.** `kubectl apply -f
# deploy/k3s/` applies every YAML in that directory, so an example sitting next to the
# real thing would overwrite a working secret with the placeholders below — and the only
# symptom would be every pod failing to authenticate against a database whose password
# had not changed.
#
# `stringData` rather than `data`: values are written as-is instead of base64, so what is
# in this file is what the pod gets. base64 is not encryption and pretending otherwise is
# how a "secret" ends up committed on the grounds that it looked encoded.
#
# **A Kubernetes Secret is base64 at rest in etcd, not encrypted.** On this single-node
# box that is the same trust boundary as the filesystem the k3s server already runs on, so
# it is the right tool here — but it is not a vault, and nothing about that changes if a
# second node ever appears.
apiVersion: v1
kind: Secret
metadata:
  name: kinex-secrets
  namespace: kinex
type: Opaque
stringData:
  # Read by the postgres container to initialise the cluster on first boot. After that
  # first boot they are inert: changing POSTGRES_PASSWORD here does NOT change the
  # password of an existing database, it only stops matching it.
  POSTGRES_USER: "kinex"
  POSTGRES_PASSWORD: "replace-me-with-a-generated-password"
  POSTGRES_DB: "kinex"

  # The same three values again, as the DSN the API and alembic read. They must agree with
  # the three above — this is the one duplication in these manifests, and it is the same
  # one backend/.env.example already carries. `postgres` is the Service name.
  KINEX_DATABASE_URL: "postgresql://kinex:replace-me-with-a-generated-password@postgres:5432/kinex"

  # Signs the JWTs the server issues. HS256 over a server-held secret — the device never
  # verifies a token, only the server does. No default anywhere in the codebase on
  # purpose: a shipped default signing secret means anyone can mint a token for any
  # device. Generate with:
  #   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
  KINEX_JWT_SECRET: "replace-me-with-a-generated-secret"

  # Groq, for interactive coach chat. https://console.groq.com/keys
  #
  # **The API pod will not start without this**, including for anyone who only wants
  # /health or session ingest: Settings declares it with no default, so a missing key is a
  # startup failure naming the variable rather than a 500 halfway through a user's
  # question. That trade is documented in the backend design doc and it means this Secret is a
  # hard prerequisite, not a nice-to-have.
  KINEX_GROQ_API_KEY: "replace-me-with-a-groq-api-key"
